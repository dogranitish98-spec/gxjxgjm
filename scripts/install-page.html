<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Add {{APP_NAME}} to your Home Screen</title>

  <link
    rel="stylesheet"
    href="/__grok/install/styles.css"
  >
</head>

<body>
  <main class="page">

    <div class="powered">
      <span class="powered-by">Powered by</span>

      <span class="powered-brand">
        <img
          class="grok-logo"
          src="/__grok/install/assets/homescreen/logo-grok.svg"
          alt=""
          aria-hidden="true"
        >

        <span class="powered-grok">Grok</span>
      </span>
    </div>

    <section class="content">

      <div class="ob">
        <img
          class="ob-img"
          src="/__grok/install/assets/homescreen/ob-phone.png"
          alt="Add {{APP_NAME}} to your Home Screen"
        >
      </div>

      <div class="copy">

        <h1>
          Add {{APP_NAME}} to your Home Screen
        </h1>

        <div class="steps">

          <div class="step">
            <span class="muted">
              1. Tap the Share button
            </span>

            <span class="glass glass--icon">
              <img
                src="/__grok/install/assets/homescreen/glass-share.svg"
                alt=""
                aria-hidden="true"
              >
            </span>
          </div>

          <div class="step">
            <span class="muted">
              2. Tap Add to Home Screen
            </span>

            <span class="glass glass--icon">
              <img
                src="/__grok/install/assets/homescreen/plus.svg"
                alt=""
                aria-hidden="true"
              >
            </span>
          </div>

          <div class="step">
            <span class="muted">
              3. Tap Add
            </span>
          </div>

        </div>

        <a
          href="{{APP_URL}}"
          style="
            margin-top: 8px;
            color: rgba(255,255,255,.7);
            text-decoration: none;
            font-size: .95rem;
          "
        >
          Open {{APP_NAME}}
        </a>

      </div>

    </section>

  </main>
</body>
</html>
